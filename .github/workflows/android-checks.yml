name: Android checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refining-the-app-for-playstore]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"'
      - name: Verify development build
        run: bash ./gradlew :app:checkArchitecture :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --no-configuration-cache
        env:
          WEGLOW_DEV_SUPABASE_URL: ${{ vars.WEGLOW_DEV_SUPABASE_URL }}
          WEGLOW_DEV_SUPABASE_PUBLISHABLE_KEY: ${{ vars.WEGLOW_DEV_SUPABASE_PUBLISHABLE_KEY }}
      # Local fixture tests. No signing secrets, hosted writes or publishing.
